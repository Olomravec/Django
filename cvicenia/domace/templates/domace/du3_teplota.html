<h1>Prevod teploty</h1>
<form method="post">
    {% csrf_token %}
    <label for="teplota">Teplota:</label>
    <input type="text" name="teplota" id="teplota" value="{{ hodnota }}" required>
    <label for="smer">Smer prevodu:</label>
    <select name="smer" id="smer">
        <option value="c_na_f" >°C → °F</option>
        <option value="f_na_c" >°F → °C</option>
    </select>
    <button type="submit">Previesť</button>
</form>
    {% if vysledok != None %}
        <p>Výsledok: <strong>{{ vysledok }} {{ jednotka }}</strong></p>
    {% endif %}
