{% extends "ulohy/base.html" %}
{% block titulok %}Súčet{% endblock %}
{% block obsah %}
<h1>Súčet dvoch čísel</h1>
<form method = "post">
     {% csrf_token %}
    <input type = "number" name="a" required>
    <select value = "znamienko" name="znamienko">
        <option value = "*">*</option>
        <option value = "+">+</option>
        <option value = "-">-</option>
    </select>
    <input type="number" name="b" required>
    <button>Vypočítať</button>
</form>
<br>
{% if vysledok != None %}
<div class="alert alert-dark" role="alert">
    <p>Výsledok je {{ vysledok }} </p>
</div> 


{% endif %}
{% endblock %}
