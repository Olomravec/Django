<h1>Súčet dvoch čísel</h1>
<form method = "post">
     {% csrf_token %}
    <input type = "number" name="a" required>
    <select value = "znamienko" name="znamienko">
        <option value = "*">*</option>
        <option value = "+">+</option>
        <option value = "-">-</option>
    </select>
    <input type="number" name="b" required>
    <button>Vypočítať</button>
</form>
{% if vysledok != None %}
<p>Výsledok je {{ vysledok }} </p>

{% endif %}
